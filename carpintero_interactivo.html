<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Dryobates scalaris - Carpintero Mexicano</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <a-asset-item id="modelo" src="https://cdn.jsdelivr.net/gh/FernandoEspinosa-hub/modelos-3d/carpintero.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#modelo" position="0 1 -3" scale="0.01 0.01 0.01"></a-entity>
      <a-light type="ambient" intensity="1"></a-light>
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
