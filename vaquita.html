<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Calligrapha mexicana - Vaquita</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <a-asset-item id="modelo" src="https://cdn.jsdelivr.net/gh/FernandoEspinosa-hub/modelos-3d/Calligrapha%20mexicana_Vaquita.glb"></a-asset-item>
      </a-assets>
      <a-entity gltf-model="#modelo" position="0 1 -3" scale="1 1 1" rotation="0 0 0"></a-entity>
      <a-light type="ambient" intensity="1"></a-light>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
