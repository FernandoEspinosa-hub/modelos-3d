<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sylvilagus floridanus – Conejo serrano 3D</title>

  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-79BNQNMDHM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-79BNQNMDHM');
  </script>

  <!-- Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin: 0; background: #f0f0f0; }
    #nombre-especie {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(255,255,255,0.85);
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      border-radius: 5px;
      font-size: 22px;
      font-weight: normal;
      z-index: 10;
      user-select: none;
    }
    #nombre-especie i { font-style: italic; font-weight: normal; }
    #marca-agua {
      position: absolute;
      bottom: 10px; right: 10px;
      background: rgba(255,255,255,0.85);
      padding: 6px 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      border-radius: 4px;
      z-index: 10;
      user-select: none;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="nombre-especie"><i>Sylvilagus floridanus</i> – Conejo serrano</div>
  <div id="marca-agua">Hecho por: M. en D. Alejandra Sánchez García e Ing. Luis Fernando Espinosa Baltazar</div>

  <model-viewer
    src="https://raw.githubusercontent.com/FernandoEspinosa-hub/modelos-3d/main/Conejo%20serrano.glb"
    alt="Sylvilagus floridanus – Conejo serrano 3D"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="20deg"
    touch-action="pan-y"
    interaction-prompt="none"
    ar
    shadow-intensity="1">
  </model-viewer>

  <!-- (Opcional) Sonido ambiente -->
  <audio autoplay loop>
    <source src="AUDIO_PENDIENTE.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>
</body>
</html>
