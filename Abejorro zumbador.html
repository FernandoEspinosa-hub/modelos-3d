<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Abejorro Zumbador 3D</title>
  <!-- Incluye model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <model-viewer
    src="https://raw.githubusercontent.com/FernandoEspinosa-hub/modelos-3d/main/Abejorro%20zumbador.glb"
    alt="Abejorro Zumbador 3D"
    auto-rotate
    camera-controls
    ar
    shadow-intensity="1">
  </model-viewer>
</body>
</html>
